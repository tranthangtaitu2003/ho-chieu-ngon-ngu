<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e23d2e">
<meta name="description" content="Học tiếng Anh, Trung, Nhật, Hàn mỗi ngày: nghe, nói, đọc, viết theo lộ trình 2 năm.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hộ chiếu NN">
<title>Hộ chiếu ngôn ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: vui, khích lệ, gọn — một app học thật kiểu Duolingo
   IDEA: cuốn hộ chiếu — mỗi ngày học xong là một con dấu đóng trên lộ trình
   PICTURE: lộ trình uốn lượn các nút Ngày 1, 2, 3… chiếm trọn màn hình đầu
   COLOUR and TYPE: nền trắng, đỏ son dấu mộc #e23d2e, mực đen, vàng #ffd23f cho nút hiện tại; Rubik
   LAYOUT: dải đỏ (ngôn ngữ + chuỗi ngày + mục tiêu), lộ trình giữa, thanh tab dưới; bài học phủ toàn màn hình */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141211);--ink:light-dark(#171615,#f3f0ec);--mute:light-dark(#6b6661,#a59f98);--red:#e23d2e;--redk:light-dark(#c42f21,#ff6a5a);--card:light-dark(#ffffff,#1f1c1a);--line:light-dark(#e7e3de,#34302c);--soft:light-dark(#f5f2ee,#24201e);--yel:#ffd23f;--ok:light-dark(#1f7a4d,#5fd39a);--okbg:light-dark(#e3f6ec,#11291d);--bad:light-dark(#c42f21,#ff7b6e);--badbg:light-dark(#fde7e4,#2e1512)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,"Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif;overflow-x:clip;padding-bottom:80px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.top{background:var(--red);color:#fff;padding:16px max(5vw,14px) 14px;position:sticky;top:0;z-index:3}
.top .in{max-width:720px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:clamp(22px,5vw,28px);line-height:1.05;font-weight:800}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:rgba(0,0,0,.2);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.langs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.lg{flex:none;min-height:40px;border:2px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:999px;padding:4px 14px;font-weight:500;white-space:nowrap}
.lg[aria-pressed=true]{background:#fff;color:var(--red);border-color:#fff}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 24px}
.goal{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:20px;padding:14px 16px}
.ring{width:56px;height:56px;flex:none}
.goal b{display:block;font-size:17px;line-height:1.3}
.goal span{font-size:14px;color:var(--mute)}
.gsel{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.gsel button{min-height:34px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;font-size:14px}
.gsel button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.path{position:relative;padding:28px 0 10px;display:flex;flex-direction:column;align-items:center;gap:22px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.nb{width:78px;height:78px;border-radius:50%;border:0;display:grid;place-items:center;font-size:26px;font-weight:800;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.nb:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node.done .nb{background:var(--red);color:#fff}
.node.cur .nb{background:var(--yel);color:#171615;width:92px;height:92px;font-size:30px}
.node.cur .nb::after{content:"";position:absolute;inset:-9px;border:3px solid var(--yel);border-radius:50%;animation:pulse 1.6s infinite}
.node.lock .nb{background:var(--soft);color:var(--mute);box-shadow:0 6px 0 var(--line);cursor:not-allowed}
.nb svg{width:34px;height:34px}
.nl{font-size:14px;text-align:center;line-height:1.3;max-width:180px}
.nl b{display:block;font-size:15px}
.nl span{color:var(--mute)}
.start{background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.25);opacity:0}}
.finish{text-align:center;padding:16px;color:var(--mute);font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));z-index:3;padding-bottom:env(safe-area-inset-bottom)}
.nav button{min-height:62px;border:0;background:none;font-weight:500;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav svg{width:24px;height:24px}
.nav button[aria-selected=true]{color:var(--redk)}
.sec h2{font-size:24px;line-height:1.1;margin:6px 0 4px}
.sec p{color:var(--mute);margin:0 0 14px}
.big{display:block;width:100%;min-height:54px;border-radius:16px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 #a82a1e}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a82a1e}
.big.dark{background:var(--ink);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.big:disabled{opacity:.45;cursor:not-allowed}
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;background:var(--card)}
.li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.li b{font-size:19px;display:block}.li em{font-style:normal;color:var(--redk);font-size:14px}
.li .vi{color:var(--mute);font-size:15px}.li .vi small{display:block;font-size:12px}
.li.lk{opacity:.5}
.spk{width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.spk svg{width:26px;height:26px}
.li .spk{width:44px;height:44px}.li .spk svg{width:20px;height:20px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:14px;color:var(--mute)}
.opts label{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}
.opts input{width:20px;height:20px;accent-color:var(--red)}
/* lesson */
#lesson{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#lesson.open{display:flex}
.lh{display:flex;align-items:center;gap:12px;padding:14px max(4vw,14px);max-width:720px;width:100%;margin:0 auto}
.x{width:44px;height:44px;border:0;background:none;font-size:28px;color:var(--mute);flex:none;line-height:1}
.lbar{flex:1;height:16px;background:var(--soft);border-radius:9px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .35s}
.lb{flex:1;overflow-y:auto;padding:8px max(4vw,14px) 20px;max-width:720px;width:100%;margin:0 auto}
.kind{font-size:22px;font-weight:700;margin:6px 0 16px;line-height:1.2}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.pw{font-size:clamp(30px,8vw,46px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.pr{color:var(--redk);font-size:18px}
.choices{display:grid;gap:10px}
.ch{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:500;padding:8px 16px;text-align:start;display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 var(--line)}
.ch .n{width:28px;height:28px;flex:none;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--mute)}
.ch small{display:block;font-weight:400;font-size:14px;color:var(--mute)}
.ch.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.ch.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.intro{border:2px solid var(--line);border-radius:24px;padding:30px 20px;text-align:center;position:relative}
.intro .pw{font-size:clamp(38px,10vw,60px)}
.intro .vi{font-size:20px;margin-top:14px;font-weight:500}
.intro .en{color:var(--mute);font-size:15px}
.intro .spk{margin:16px auto 0}
.new{position:absolute;top:14px;left:16px;background:var(--yel);color:#171615;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.match .col{display:grid;gap:10px}
.mt{min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:500;padding:6px 8px;box-shadow:0 3px 0 var(--line);overflow-wrap:anywhere}
.mt.sel{border-color:var(--yel);background:color-mix(in srgb,var(--yel) 25%,var(--card))}
.mt.ok{opacity:.25;pointer-events:none;box-shadow:none}
.mt.bad{border-color:var(--bad);color:var(--bad)}
.lf{border-top:2px solid var(--line);padding:16px max(4vw,14px) calc(16px + env(safe-area-inset-bottom))}
.lf .in{max-width:720px;margin:0 auto}
.lf.ok{background:var(--okbg);border-color:transparent}.lf.bad{background:var(--badbg);border-color:transparent}
.fb{font-weight:700;font-size:19px;margin-bottom:10px;display:none}
.lf.ok .fb{display:block;color:var(--ok)}.lf.bad .fb{display:block;color:var(--bad)}
.fb small{display:block;font-weight:500;font-size:16px}
.lf.ok .big{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.done-screen{text-align:center;padding-top:20px}
.seal{width:170px;height:170px;margin:10px auto 18px;border:5px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1.15;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.seal small{display:block;font-size:13px;font-weight:500}
@keyframes stamp{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.res div{border:2px solid var(--line);border-radius:16px;padding:10px 6px}
.res b{display:block;font-size:24px;color:var(--redk)}.res span{font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:8px;vertical-align:middle;background:var(--soft);color:var(--mute)}
.sk-nghe{background:#2f6fde;color:#fff}.sk-noi{background:var(--red);color:#fff}.sk-doc{background:#1f7a4d;color:#fff}.sk-viet{background:var(--yel);color:#171615}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.skc{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 8px;text-align:start;display:grid;gap:4px}
.skc .sk{margin:0;justify-self:start}.skc b{font-size:20px;line-height:1.1}.skc small{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skbig{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:16px;text-align:start;display:grid;gap:6px;box-shadow:0 4px 0 var(--line);min-height:130px;align-content:start}
.skbig .sk{justify-self:start;margin:0}.skbig b{font-size:19px}.skbig small{color:var(--mute);font-size:14px;line-height:1.35}.skbig:disabled{opacity:.5}
.skr{display:flex;align-items:center;gap:10px;margin:8px 0}.skr .sk{width:52px;text-align:center}.skr b{width:44px;text-align:right}
.tin{width:100%;min-height:56px;border:2px solid var(--line);border-radius:16px;padding:0 16px;font-size:20px;background:var(--card)}
.tin:focus{border-color:var(--ink);outline:none}
.thint{font-size:14px;color:var(--mute);margin-top:8px}
.ansrow{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tk{min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.tk.used{background:var(--soft);color:transparent;box-shadow:none}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:14px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;font-weight:500;color:var(--redk)}
.ghost.sm{margin-top:8px;font-size:14px;min-height:38px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;margin:20px auto 0;box-shadow:0 6px 0 #a82a1e}
.mic svg{width:40px;height:40px}.mic.on{animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--red) 25%,transparent)}}
.self{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.btn2{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700}
.btn2.ok{border-color:var(--ok);color:var(--ok)}.btn2.bad{color:var(--bad)}
.skip{display:block;margin:16px auto 0;border:0;background:none;color:var(--mute);text-decoration:underline;min-height:44px;font-size:14px}
@media(max-width:600px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{width:100%;text-align:center;padding:14px 10px 4px;border-top:2px dashed var(--line);margin-top:6px}
.wk:first-child{border-top:0;margin-top:0}
.wk b{display:block;font-size:18px}.wk span{font-size:14px;color:var(--mute)}
.node.rv .nb{border-radius:22px}
.node.rv.cur .nb::after{border-radius:28px}
.node.rv.lock .nb{color:var(--line)}
.road{margin-top:28px;border:2px solid var(--line);border-radius:22px;padding:18px}
.road h2{margin:0 0 4px;font-size:22px}.road>p{color:var(--mute);margin:0 0 12px;font-size:15px}
.road ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.road li{display:flex;gap:12px;align-items:flex-start;opacity:.6}.road li.open{opacity:1}
.road li>div{flex:1;display:grid;gap:3px}
.road li small{color:var(--mute);font-size:13px}.road .soon{color:var(--redk)}
.pn{width:30px;height:30px;flex:none;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.road li.open .pn{background:var(--red);color:#fff}
.set{margin-top:20px;border:2px solid var(--line);border-radius:18px;padding:4px 16px 12px}
.set summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.bk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.inst{border:0;background:#fff;color:var(--red);font-weight:700;cursor:pointer}
.ios{position:fixed;left:12px;right:12px;bottom:76px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:5;font-size:14px}
.ios button{border:0;background:none;color:inherit;font-size:24px;width:40px;height:40px;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="hrow"><h1>Hộ chiếu ngôn ngữ</h1>
    <div class="pills"><button class="pill inst" id="instb" data-act="install" hidden>Cài app</button><span class="pill" id="pStreak" title="Chuỗi ngày học">0 ngày</span><span class="pill" id="pXp">0 XP</span></div></div>
  <div class="langs" id="langs"></div>
</div></header>
<main id="main"></main>
<nav class="nav" role="tablist">
  <button role="tab" data-tab="path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="5" r="2.5"/><circle cx="17" cy="12" r="2.5"/><circle cx="7" cy="19" r="2.5"/><path d="M9.3 6.2 14.8 10.6M14.8 13.4 9.3 17.8"/></svg>Lộ trình</button>
  <button role="tab" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ôn tập</button>
  <button role="tab" data-tab="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>Từ điển</button>
</nav>
<div id="lesson"><div class="lh"><button class="x" data-act="quit" aria-label="Thoát bài học">×</button><div class="lbar"><i id="lbar"></i></div></div>
  <div class="lb" id="lb"></div><div class="lf" id="lf"><div class="in"><div class="fb" id="fb"></div><button class="big" id="lbtn" data-act="cont">Tiếp tục</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
